# Irodori-TTS-v4-Large phase 2 duration predictor training configuration.
# Initialize from the completed duration-free v4 Large phase 1 checkpoint.

model:
  latent_dim: 32
  latent_patch_size: 1
  text_vocab_size: 262144
  text_tokenizer_repo: google/t5gemma-2-1b-1b
  text_encoder_revision: dd0a2683227859151b1730ca3a63087df5b5f39b
  text_encoder_type: pretrained
  text_add_bos: true
  pretrained_projector_type: residual_mlp
  pretrained_projector_hidden_ratio: 2.0
  pretrained_projector_dropout: 0.0
  model_dim: 2048
  num_layers: 24
  num_heads: 32
  mlp_ratio: 2.875
  speaker_mlp_ratio: 2.6
  text_dim: 1280
  speaker_dim: 1280
  speaker_layers: 14
  speaker_heads: 20
  speaker_patch_size: 4
  timestep_embed_dim: 512
  adaln_rank: 256
  use_caption_condition: true
  use_speaker_condition: true
  caption_vocab_size: 262144
  caption_tokenizer_repo: google/t5gemma-2-1b-1b
  caption_add_bos: true
  caption_dim: 1280
  use_duration_predictor: true
  duration_aux_dim: 14
  duration_hidden_dim: 1280
  duration_layers: 4
  duration_dropout: 0.1
  duration_attention_heads: 20
  duration_architecture: token_sum_dual_adarn_zero_no_aux
  duration_token_init_frames: 9.0
  duration_speaker_fusion: adarn_zero
  duration_caption_fusion: adarn_zero
  duration_caption_pooling: masked_mean

train:
  train_mode: duration_only
  batch_size: 80
  gradient_accumulation_steps: 1
  num_workers: 16
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: 4
  dataloader_cuda_prefetch: true
  length_bucket_enabled: false
  allow_tf32: true
  compile_model: false
  precision: bf16
  optimizer: muon
  muon_momentum: 0.95
  learning_rate: 0.0001
  weight_decay: 0.01
  lr_scheduler: wsd
  warmup_steps: 1000
  stable_steps: 24000
  min_lr_scale: 0.01
  max_steps: 30000
  max_text_len: 256
  max_caption_len: 512
  text_condition_dropout: 0.1
  speaker_condition_dropout: 0.1
  caption_condition_dropout: 0.1
  caption_warmup: false
  caption_warmup_steps: 0
  timestep_stratified: true
  max_latent_steps: 750
  ref_min_seconds: 1.0
  ref_max_seconds: 120.0
  fixed_target_latent_steps:
  fixed_target_full_mask: false
  rf_loss_mode: utterance_mean
  duration_loss_weight: 1.0
  duration_speaker_dropout: 0.1
  duration_caption_dropout: 0.1
  duration_huber_delta: 0.1
  log_every: 100
  save_every: 1000
  checkpoint_best_n: 5
  wandb_enabled: false
  wandb_project:
  wandb_entity:
  wandb_run_name:
  wandb_mode: online
  ddp_find_unused_parameters: false
  valid_ratio: 0.0005
  valid_every: 1000
  seed: 0
