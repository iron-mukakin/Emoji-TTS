[project]
name = "irodori-tts"
version = "0.1.0"
description = "Irodori-TTS training and inference codebase"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "dacvae",
    "datasets>=3.0.0",
    "faster-whisper",
    "gradio>=5.0.0",
    "huggingface-hub>=0.34.0",
    "librosa",
    "llvmlite>=0.40.0",
    "numba>=0.57.0",
    "openai",
    "pandas>=2.3.3",
    "peft>=0.18.0",
    "pyyaml>=6.0",
    "safetensors>=0.7.0",
    # 0.2.1以降でcp313用Windowsホイールが提供された（0.1.99/0.2.0はビルド必須で失敗しやすい）
    "sentencepiece>=0.2.1,<0.3",
    "silentcipher @ git+https://github.com/SesameAILabs/silentcipher.git@d46d7d0893a583d8968ab3a6626e2289faec9152",
    "soundfile>=0.12.0",
    "torch>=2.9.1,<2.10",
    "torchaudio>=2.9.1,<2.10",
    "torchcodec>=0.9.1,<0.10",
    "transformers>=5.12.1,<6",
    "tqdm>=4.67.3",
    "wandb>=0.17.0",
]

[project.optional-dependencies]
# 量子化チェックポイント(int8/int4/float8, quantization.py)を読み込む場合のみ:
#   uv sync --extra quantization
quantization = [
    "torchao>=0.16.0,<0.17.0",
]
dev = [
    "ruff>=0.9.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
dacvae = { git = "https://github.com/facebookresearch/dacvae" }

# 旧GPU（GTX 10系等のPascal/Volta、sm_75未満）はCUDA 13系（cu130/cu128）が未対応のため
# pytorch-cu130 を pytorch-cu126 へ張替えて uv sync / uv lock し直すこと（torch 2.9.1のcu126ビルドはsm_50以上対応）。

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools]
packages = ["irodori_tts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["irodori_tts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
